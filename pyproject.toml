[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv", "__pycache__", ".git"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "SIM", "ARG"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
