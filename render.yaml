services:
  - type: web
    name: frk-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        value: sqlite:///data/frk.db
      - key: API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://kienyeji.netlify.app
    healthCheckPath: /health
    autoDeploy: true
